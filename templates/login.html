<!doctype html>
<html>
  <head>
    <title>Login</title>

    <style>
      body {
        margin: 0;
        font-family: Segoe UI;
        background: url("{{ url_for('static', filename='background.jpg') }}");
        background-size: cover;
        background-position: center;
        text-align: center;
      }

      .box {
        background: rgba(255, 255, 255, 0.9);
        width: 350px;
        margin: 120px auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 0 20px black;
      }

      input {
        width: 80%;
        padding: 10px;
        margin: 10px;
        border-radius: 8px;
        border: 1px solid gray;
      }

      button {
        background: #1e3d59;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #ff6e40;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>Login</h2>

      <form action="/login" method="post">
        <input
          type="email"
          name="email"
          placeholder="Enter Email"
          required
        /><br />
        <input
          type="password"
          name="password"
          placeholder="Enter Password"
          required
        /><br />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
